name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        env: { BUILD_NO: "${{ github.run_number }}" }
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publish APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk eigo-drive.apk
          gh release delete app-latest --cleanup-tag -y || true
          gh release create app-latest eigo-drive.apk --title "英作文ドライブ（最新）" --notes "ビルド ${{ github.run_number }}" --latest
