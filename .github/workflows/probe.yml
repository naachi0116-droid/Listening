name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=$(curl -s https://podcasts.files.bbci.co.uk/p02nq0gn.rss | grep -o 'enclosure url="[^"]*"' | head -1 | cut -d'"' -f2)
          H=$(echo "$U" | sed -e 's#^http://#https://#' -e 's#/proto/http/#/proto/https/#'); echo "H=$H"
          curl -sIL -H "Origin: https://x.github.io" "$H" | grep -i -E "^HTTP|^location|access-control-allow-origin|content-length" | cut -c1-80
